name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Behavior regression
        run: node bench/behavior-test.cjs lib/client.js
      - name: Benchmark smoke
        run: node bench/bench.cjs lib/client.js
